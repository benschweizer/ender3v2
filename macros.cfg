[gcode_macro WLED_ON]
description: Turn WLED strip on using optional preset and resets led colors
gcode:
  {% set strip = params.STRIP|default("chamber")|string %}
  {% set preset = params.PRESET|default(2)|int %}
  {action_call_remote_method("set_wled_state", strip=strip, state=True, preset=preset)}

# 20260105 load bed mesh, wled
[gcode_macro START_PRINT]
gcode:
    # 1. Turn on lighting
    WLED_ON STRIP=chamber PRESET=6

    # 2. Extract parameters from slicer (with defaults)
    {% set BED_TEMP = params.BED_TEMP|default(51)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(161)|float %}

    # 3. Start bed heating & set standby nozzle temp to prevent oozing
    M117 Preheating...
    M140 S{BED_TEMP}                # Start bed heating (non-blocking)
    M104 S150                       # Set nozzle to 150°C standby (non-blocking)

    # 4. Home all axes while heating
    M117 Homing...
    G28

    ## 5. Wait for bed to reach target temperature before probing
    #M117 Waiting for Bed Temp...
    #M190 S{BED_TEMP}

    # 6. Perform adaptive mesh on hot bed
    M117 Adaptive Bed Leveling...
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 7. Heat nozzle to final printing temperature
    M117 Heating ...
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}           # Wait for nozzle to reach target temp

    # 8. Prime line to build nozzle pressure
    M117 Priming Nozzle...
    G90                             # Absolute positioning
    G1 Z2.0 F3000                   # Move Z Up
    G1 X0.1 Y20 Z0.3 F5000.0        # Move to start position
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15  # Draw first line
    G1 X0.4 Y200.0 Z0.3 F5000.0     # Move to side
    G1 X0.4 Y20 Z0.3 F1500.0 E30    # Draw second line
    G92 E0                          # Reset extruder distance
    G1 Z2.0 F3000                   # Move Z up to clear bed

    # Printing ...
    M117 Printing...
    WLED_ON STRIP=chamber PRESET=1

[gcode_macro END_PRINT]
gcode:
  M117 Finished
  WLED_ON STRIP=chamber PRESET=2

  {% set X_MAX = printer.toolhead.axis_maximum.x|default(235)|float %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y|default(235)|float %}
  G91 ; Relative positioning
  G1 E-2 F2700 ; Retract filament
  G1 Z10 F3000 ; Lift Z by 10mm
  G90 ; Absolute positioning
#  G1 X X{X_MAX / 2} Y{Y_MAX} Z50 F5000.0 ; Move over to prevent blob squish
  G1 X X{X_MAX / 2} Y{Y_MAX} F5000.0 ; Move over to prevent blob squish
  M106 S0 ; Turn off part cooling fan
  M104 S0 ; Turn off extruder heater
  M140 S0 ; Turn off bed heater
  M84 X Y E ; Disable motors

#[gcode_macro PAUSE]
#description: Pause the actual running print
#rename_existing: PAUSE_BASE
#gcode:
#  WLED_ON STRIP=chamber PRESET=7
#  PAUSE_BASE
#  _TOOLHEAD_PARK_PAUSE_CANCEL
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  M117 Pausing
  WLED_ON STRIP=chamber PRESET=7
  # Parameters
  {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

  {% if printer['pause_resume'].is_paused|int == 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

#    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
    SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
    BASE_PAUSE                                                                           ; pause print
    {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
      G91                                                                              ; relative positioning
      G1 Z{z} F900                                                                     ; raise Z up by z hop amount
    {% else %}
      { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    {% endif %}
    G90                                                                                  ; absolute positioning
#    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-5} F6000   ; park toolhead at front center
    SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
    M104 S0                                                                              ; turn off hotend
    SET_IDLE_TIMEOUT TIMEOUT=3600                                                       ; set timeout to 1 hours
  {% endif %}

#[gcode_macro RESUME]
#description: Resume the actual running print
#rename_existing: RESUME_BASE
#gcode:
#  WLED_ON STRIP=chamber PRESET=6
#  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro ####
#
#  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
#  #### get VELOCITY parameter if specified ####
#  {% if 'VELOCITY' in params|upper %}
#    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
#  {%else %}
#    {% set get_params = "" %}
#  {% endif %}
#  ##### end of definitions #####
#  {% if printer.extruder.can_extrude|lower == 'true' %}
#    M83
#    G1 E{extrude} F2100
#    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
#  {% else %}
#    {action_respond_info("Extruder not hot enough")}
#  {% endif %}
#
#  RESUME_BASE {get_params}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
  M117 Printing
  WLED_ON STRIP=chamber PRESET=6
  # Parameters
  {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

  {% if printer['pause_resume'].is_paused|int == 1 %}
#    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
    #INITIAL_RGB                                                                    ; reset LCD color
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
    {% if etemp > 0 %}
      M109 S{etemp|int}                                                        ; wait for hotend to heat back up
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
    G91                                                                          ; relative positioning
    M83                                                                          ; relative extruder positioning
    {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
      G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
    {% else %}
      G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
    BASE_RESUME                                                                  ; resume print
  {% endif %}
  
[gcode_macro CANCEL_PRINT]
gcode:
  M117 Canceled
  WLED_ON STRIP=chamber PRESET=5
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE