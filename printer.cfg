# source: https://github.com/Klipper3d/klipper/blob/master/config/printer-creality-ender3-v2-2020.cfg
# This file contains pin mappings for the stock 2020 Creality Ender 3
# V2. To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
#x_offset: -42 # sprite extruder pro with 3d touch lifter
#y_offset: -30
#sprite pro w/ lifter
#x_offset: -32
#y_offset: -40
#sprite pro w/ lifter
x_offset: -45 # -32 -13 (old raiser: -16)
y_offset: -40

[safe_z_home]
home_xy_position: 117.5, 117.5 # Change coordinates to the center of your print bed
z_hop: 10                 # Move up 10mm
z_hop_speed: 10

[bed_mesh]
speed: 120
#mesh_min: 20, 20 # x,y
mesh_min: 0, 5 # x,y
#mesh_max: 190, 202
#mesh_max: 169, 175 # 235-46-20,235-40-20
mesh_max: 180, 180 # 235-45,235-40 # minus 10 because of bicubic and mesh_pps 2,2
horizontal_move_z: 3 # default 5
probe_count: 7, 7
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[screws_tilt_adjust]
screw1: 30,30 
screw1_name: front left
screw2: 200,30 
screw2_name: front right 
screw3: 200,200 
screw3_name: back right 
screw4: 30,200 
screw4_name: back left
#screw1: 74, 42
#screw1_name: front left
#screw2: 245, 42
#screw2_name: front right
#screw3: 245, 213
#screw3_name: back right
#screw4: 74, 213
#screw4_name: back left
screw_thread: CW-M4
horizontal_move_z: 10

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
#homing_retract_dist: 5
position_max: 233 # -2 for retract dist
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
#homing_retract_dist: 5
position_max: 233 # -2 for retract dist
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PA7
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.0
position_min: -2
position_max: 250

# ender 3v2 default extruder
# [extruder]
# max_extrude_only_distance: 100.0
# step_pin: PB4
# dir_pin: PB3
# enable_pin: !PC3
# microsteps: 16
# rotation_distance: 34.406
# nozzle_diameter: 0.400
# filament_diameter: 1.750
# heater_pin: PA1
# sensor_type: EPCOS 100K B57560G104F
# sensor_pin: PC5
# control: pid
# # tuned for stock hardware with 200 degree Celsius target
# pid_Kp: 21.527
# pid_Ki: 1.063
# pid_Kd: 108.982
# min_temp: 0
# max_temp: 250

# sprite extruder pro, similar to ender 3 s1, https://forum.drucktipps3d.de/forum/thread/22066-ender-3v2-umbau-auf-sprite-extruder-pro/
[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12 # https://forum.drucktipps3d.de/forum/thread/22066-ender-3v2-umbau-auf-sprite-extruder-pro/
rotation_distance: 26.359
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
# ender3pro
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300
# 20260118 pressure advance
#pressure_advance: 0.060 # pla amazon blue 18*0.005, orange 12mm @2500-150
#pressure_advance: 0.050 # pla amazon blue 18*0.005, orange 10mm @2500-100
#pressure_advance: 0.050 # pla geeetech orange 10*0.005 @500-150
# 20260604 gemini recommendation
pressure_advance: 0.02 # just a bit
max_extrude_only_velocity: 60   # Allows high-speed retractions
max_extrude_only_accel: 1000    # Quick retraction snaps

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
# tuned for stock hardware with 50 degree Celsius target
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 10
max_z_accel: 100

# 20250104 more sensors
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[virtual_sdcard]
on_error_gcode:
    CANCEL_PRINT

[include macros.cfg]

[exclude_object]

